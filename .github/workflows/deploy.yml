name: Deploy to AWX

on:
  push:
    branches:
      - main

env:
  AWX_HOST: http://13.37.248.85:32752
  AWX_TOKEN: ${{ secrets.AWX_TOKEN }}
  JOB_TEMPLATE_ID: 5  # Update with your "Deploy to AWS Lab (Dynamic)" template ID

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get job template ID
        id: get_template
        run: |
          echo "Fetching job template details from AWX..."
          TEMPLATE_ID=$(curl -s -H "Authorization: Bearer $AWX_TOKEN" \
            "$AWX_HOST/api/v2/job_templates/?name=Deploy%20to%20AWS%20Lab%20%28Dynamic%29" | \
            jq -r '.results[0].id')
          echo "template_id=$TEMPLATE_ID" >> $GITHUB_OUTPUT
          echo "Found template ID: $TEMPLATE_ID"

      - name: Launch AWX job
        id: launch_job
        run: |
          TEMPLATE_ID=${{ steps.get_template.outputs.template_id }}
          echo "Launching job template $TEMPLATE_ID..."

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $AWX_TOKEN" \
            -H "Content-Type: application/json" \
            "$AWX_HOST/api/v2/job_templates/$TEMPLATE_ID/launch/" \
            -d '{}')

          JOB_ID=$(echo $RESPONSE | jq -r '.id')
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
          echo "Launched job: $JOB_ID"

      - name: Wait for job completion
        run: |
          JOB_ID=${{ steps.launch_job.outputs.job_id }}
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(curl -s -H "Authorization: Bearer $AWX_TOKEN" \
              "$AWX_HOST/api/v2/jobs/$JOB_ID/" | jq -r '.status')

            echo "Job $JOB_ID status: $STATUS (attempt $((ATTEMPT+1))/$MAX_ATTEMPTS)"

            if [ "$STATUS" = "successful" ]; then
              echo "✅ Job completed successfully!"
              exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
              echo "❌ Job failed with status: $STATUS"
              exit 1
            fi

            ATTEMPT=$((ATTEMPT+1))
            sleep 5
          done

          echo "❌ Job timeout after $((MAX_ATTEMPTS * 5)) seconds"
          exit 1

      - name: Post job output
        if: always()
        run: |
          JOB_ID=${{ steps.launch_job.outputs.job_id }}
          echo "## AWX Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Job ID: $JOB_ID" >> $GITHUB_STEP_SUMMARY
          echo "AWX URL: $AWX_HOST/ui/#/jobs/playbook/$JOB_ID" >> $GITHUB_STEP_SUMMARY

          STATUS=$(curl -s -H "Authorization: Bearer $AWX_TOKEN" \
            "$AWX_HOST/api/v2/jobs/$JOB_ID/" | jq -r '.status')
          echo "Status: $STATUS" >> $GITHUB_STEP_SUMMARY

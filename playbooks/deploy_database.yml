---
- name: Deploy Database Tier
  hosts: all
  gather_facts: yes
  vars:
    db_version: "15.0"
    db_user: "appuser"
    backup_retention: 7

  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: dist
      become: yes
      register: apt_update

    - name: Install PostgreSQL server
      apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present
      become: yes

    - name: Ensure PostgreSQL service is started
      systemd:
        name: postgresql
        state: started
        enabled: yes
      become: yes

    - name: Create application database user
      shell: |
        sudo -u postgres psql -c "CREATE USER {{ db_user }} WITH PASSWORD '{{ db_password }}';" 2>/dev/null || true
      vars:
        db_password: "{{ lookup('env', 'DB_PASSWORD') | default('changeme') }}"
      ignore_errors: yes

    - name: Create application database
      shell: |
        sudo -u postgres psql -c "CREATE DATABASE appdb OWNER {{ db_user }};" 2>/dev/null || true
      ignore_errors: yes

    - name: Grant privileges on database
      shell: |
        sudo -u postgres psql appdb -c "GRANT ALL PRIVILEGES ON SCHEMA public TO {{ db_user }};"
      ignore_errors: yes

    - name: Find PostgreSQL configuration directory
      shell: sudo -u postgres psql -c "SHOW config_file;" 2>/dev/null | grep -v config_file | grep -v "^$" | awk '{print $1}' | head -1
      register: pg_config_path
      ignore_errors: yes

    - name: Set PostgreSQL config path fact
      set_fact:
        pg_config_file: "{{ pg_config_path.stdout | default('/etc/postgresql/15/main/postgresql.conf') }}"
        pg_hba_file: "{{ (pg_config_path.stdout | dirname) }}/pg_hba.conf"
      when: pg_config_path.stdout is defined

    - name: Enable PostgreSQL remote connections
      shell: |
        CONFIG_FILE="{{ pg_config_file }}"
        if grep -q "listen_addresses" "$CONFIG_FILE" 2>/dev/null; then
          sudo sed -i "s/#*listen_addresses.*/listen_addresses = '*'/" "$CONFIG_FILE"
        else
          echo "listen_addresses = '*'" | sudo tee -a "$CONFIG_FILE"
        fi
      ignore_errors: yes

    - name: Add pg_hba.conf entry for application
      shell: |
        HBA_FILE="{{ pg_hba_file }}"
        if ! grep -q "appdb.*{{ db_user }}" "$HBA_FILE" 2>/dev/null; then
          echo "host    appdb       {{ db_user }}     0.0.0.0/0     md5" | sudo tee -a "$HBA_FILE"
        fi
      ignore_errors: yes

    - name: Start backup logging
      file:
        path: /var/log/postgres_backup.log
        state: touch
        mode: '0644'
      become: yes

    - name: Verify database is healthy
      shell: sudo -u postgres psql -c "SELECT version();"
      register: db_version_check
      ignore_errors: yes

    - name: Report database deployment status
      debug:
        msg: |
          ✓ Database tier deployment complete
          - PostgreSQL version: {{ db_version_check.stdout_lines[0] if db_version_check.stdout_lines else 'Unknown' }}
          - Database: appdb
          - User: {{ db_user }}
          - Connections enabled: remote (0.0.0.0/0)

  handlers:
    - name: Reload PostgreSQL
      systemd:
        name: postgresql
        state: reloaded
      become: yes

  post_tasks:
    - name: Create deployment marker
      file:
        path: /var/log/deployment_db_{{ ansible_date_time.date }}.marker
        state: touch
      become: yes

---
- name: Deploy Database Tier
  hosts: all
  gather_facts: yes
  vars:
    db_version: "15.0"
    db_user: "appuser"
    backup_retention: 7

  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: dist
      become: yes
      register: apt_update

    - name: Install PostgreSQL server
      apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present
      become: yes

    - name: Ensure PostgreSQL service is started
      systemd:
        name: postgresql
        state: started
        enabled: yes
      become: yes

    - name: Create application database user
      shell: |
        psql -c "CREATE USER {{ db_user }} WITH PASSWORD '{{ db_password }}';" 2>/dev/null || true
      become: yes
      become_user: postgres
      vars:
        db_password: "{{ lookup('env', 'DB_PASSWORD') | default('changeme') }}"

    - name: Create application database
      shell: |
        psql -c "CREATE DATABASE appdb OWNER {{ db_user }};" 2>/dev/null || true
      become: yes
      become_user: postgres

    - name: Grant privileges on database
      shell: |
        psql appdb -c "GRANT ALL PRIVILEGES ON SCHEMA public TO {{ db_user }};"
      become: yes
      become_user: postgres

    - name: Enable PostgreSQL remote connections
      lineinfile:
        path: /etc/postgresql/15/main/postgresql.conf
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"
        backup: yes
      become: yes
      notify: Reload PostgreSQL

    - name: Add pg_hba.conf entry for application
      lineinfile:
        path: /etc/postgresql/15/main/pg_hba.conf
        line: "host    appdb       {{ db_user }}     0.0.0.0/0     md5"
        insertbefore: "^# IPv4"
        backup: yes
      become: yes
      notify: Reload PostgreSQL

    - name: Start backup logging
      file:
        path: /var/log/postgres_backup.log
        state: touch
        mode: '0644'
      become: yes

    - name: Verify database is healthy
      shell: psql -c "SELECT version();"
      become: yes
      become_user: postgres
      register: db_version_check

    - name: Report database deployment status
      debug:
        msg: |
          ✓ Database tier deployment complete
          - PostgreSQL version: {{ db_version_check.stdout_lines[0] if db_version_check.stdout_lines else 'Unknown' }}
          - Database: appdb
          - User: {{ db_user }}
          - Connections enabled: remote (0.0.0.0/0)

  handlers:
    - name: Reload PostgreSQL
      systemd:
        name: postgresql
        state: reloaded
      become: yes

  post_tasks:
    - name: Create deployment marker
      file:
        path: /var/log/deployment_db_{{ ansible_date_time.date }}.marker
        state: touch
      become: yes

---
- name: Health Check - Database Tier
  hosts: db_servers
  gather_facts: no
  vars:
    db_host: "{{ inventory_hostname }}"
    db_port: 5432
    db_name: "appdb"
    db_user: "appuser"

  tasks:
    - name: Check PostgreSQL service is running
      systemd:
        name: postgresql
        state: started
      check_mode: yes
      register: pg_status

    - name: Test PostgreSQL connectivity
      shell: psql -h {{ db_host }} -U {{ db_user }} -d {{ db_name }} -c "SELECT 1;" 2>&1
      environment:
        PGPASSWORD: "{{ lookup('env', 'DB_PASSWORD') | default('changeme') }}"
      register: db_conn_test
      ignore_errors: yes

    - name: Check database size
      shell: psql -c "SELECT pg_database.datname, pg_size_pretty(pg_database_size(pg_database.datname)) FROM pg_database;" 2>&1
      become: yes
      become_user: postgres
      register: db_size
      ignore_errors: yes

    - name: Check active connections
      shell: psql -c "SELECT datname, count(*) FROM pg_stat_activity GROUP BY datname;" 2>&1
      become: yes
      become_user: postgres
      register: db_connections
      ignore_errors: yes

    - name: Check table integrity
      shell: psql -d {{ db_name }} -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname = 'public';" 2>&1
      environment:
        PGPASSWORD: "{{ lookup('env', 'DB_PASSWORD') | default('changeme') }}"
      register: db_tables
      ignore_errors: yes

    - name: Determine database health status
      set_fact:
        db_health: "{% if db_conn_test.failed %}DEGRADED{% elif 'SELECT 1' in db_conn_test.stdout or '1' in db_conn_test.stdout %}HEALTHY{% else %}UNKNOWN{% endif %}"

    - name: Report database health
      debug:
        msg: |
          Database Health Check Results:
          - Status: {{ db_health }}
          - Service: {{ 'Running' if pg_status.state == 'started' else 'Not Running' }}
          - Connectivity: {{ 'OK' if not db_conn_test.failed else 'FAILED' }}
          - Active connections: {{ db_connections.stdout if not db_connections.failed else 'Unknown' }}
          - Tables in appdb: {{ db_tables.stdout if not db_tables.failed else 'Unknown' }}
          - Check timestamp: {{ ansible_date_time.iso8601 }}

    - name: Fail if database unhealthy
      fail:
        msg: "Database health check failed: {{ db_health }}"
      when: db_health != "HEALTHY"

  rescue:
    - name: Report health check failure
      debug:
        msg: "⚠️ Database health check FAILED - Manual intervention required"

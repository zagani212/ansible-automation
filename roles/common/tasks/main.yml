- name: Update apt cache (Ubuntu/Debian)
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Update yum cache (CentOS/RHEL)
  yum:
    update_cache: yes
  when: ansible_os_family == "RedHat"

- name: Install packages
  ansible.builtin.package:
    name: "{{ packages }}"
    state: present
    
- name: Verify custom packages
  shell: python3 -m pip list | grep -E "boto3|kubernetes|requests"
  register: packages

- name: Show installed packages
  debug:
    msg: "{{ packages.stdout }}"

- name: List Ansible collections
  shell: ansible-galaxy collection list
  register: collections

- name: Show collections
  debug:
    msg: "{{ collections.stdout }}"
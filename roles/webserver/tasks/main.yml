- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Start and Enable service nginx, if not started
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Configure nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: Restart Nginx